<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><style>body{font:16px system-ui;margin:20px;line-height:1.6}button,input{font:inherit;margin:6px;padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(prefers-color-scheme:dark){body{background:#151b19;color:#edf5f0}} </style></head><body><h2>Jobs PWA</h2><input id="note" value="Jobs Flutter"><div id="buttons"></div><pre id="result"></pre><script>
const lang=new URLSearchParams(location.search).get('lang')||'en';
const names={zh:['保存','读取','重新加载','清空'], 'zh-Hant':['儲存','讀取','重新載入','清空'],bo:['ཉར་བ་','ཀློག་པ་','ཡང་བསྐྱར་འགེལ་བ་','གཙང་བཟོ་'],en:['Save','Read','Reload','Clear'],ja:['保存','読込','再読込','消去'],fr:['Enregistrer','Lire','Recharger','Effacer'],es:['Guardar','Leer','Recargar','Borrar'],de:['Speichern','Lesen','Neu laden','Leeren'],ru:['Сохранить','Прочитать','Обновить','Очистить'],ko:['저장','읽기','새로 고침','지우기']}[lang]||['Save','Read','Reload','Clear'];
const output=value=>document.querySelector('#result').textContent=JSON.stringify(value,null,2);
const actions=[()=>{localStorage.setItem('jobs.pwa.note',document.querySelector('#note').value);output({stored:true,online:navigator.onLine});},()=>output({note:localStorage.getItem('jobs.pwa.note'),online:navigator.onLine}),async()=>{if(!('serviceWorker'in navigator)){output({serviceWorker:false,context:location.protocol});return;}try{const registration=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;output({scope:registration.scope,controlled:!!navigator.serviceWorker.controller,caches:await caches.keys(),online:navigator.onLine});}catch(error){output({error:String(error)});}},async()=>{localStorage.removeItem('jobs.pwa.note');if('caches'in window){for(const key of await caches.keys()){if(key==='jobs-micro-pwa-v1')await caches.delete(key);}}output({cleared:true});}];
actions.forEach((action,i)=>{const button=document.createElement('button');button.textContent=names[i];button.onclick=action;document.querySelector('#buttons').append(button);});output({online:navigator.onLine,serviceWorker:'serviceWorker'in navigator,origin:location.origin});
</script></body></html>
