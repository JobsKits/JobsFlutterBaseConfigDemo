name: jobs_rust_ocr
description: Jobs Rust offline OCR native bridge.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: JobsRustOCRPlugin
      macos:
        pluginClass: JobsRustOCRPlugin
