name: jobs_platform_lab
description: Jobs Flutter 原生平台实验室，提供 AR、蓝牙、传感器、录音与系统能力。
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: JobsPlatformLabPlugin
      android:
        package: com.jobs.platformlab
        pluginClass: JobsPlatformLabPlugin
